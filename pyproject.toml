[project]
name = "slides-to-video"
version = "1.0.0"
description = "TTS worker for the Slides to Video Mac app"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "soundfile",
    "torch>=2.6,<2.8",
    "torchaudio>=2.6,<2.8",
]

[project.scripts]
slides-to-video-worker = "slides_to_video.worker:main"

[project.optional-dependencies]
chatterbox = ["chatterbox-tts", "ml-dtypes>=0.5", "setuptools<81"]
qwen3 = ["qwen-tts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
conflicts = [
    [
        { extra = "chatterbox" },
        { extra = "qwen3" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
