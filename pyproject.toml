[project]
name = "slides-to-video"
version = "0.2.0"
description = "Generate narrated presentation videos from slides, a script, and a voice sample"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi",
    "numpy",
    "python-multipart",
    "soundfile",
    "torch>=2.6,<2.8",
    "torchaudio>=2.6,<2.8",
    "uvicorn",
]

[project.scripts]
slides-to-video = "slides_to_video.cli:main"
slides-to-video-editor = "slides_to_video.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx", "pytest"]
chatterbox = ["chatterbox-tts", "ml-dtypes>=0.5"]
qwen3 = ["qwen-tts"]

[tool.uv]
conflicts = [
    [
        { group = "chatterbox" },
        { group = "qwen3" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
